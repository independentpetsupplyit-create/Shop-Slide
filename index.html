<!DOCTYPE html>
<html>
<head>
    <base target="_parent">
    <style>
        body { margin: 0; padding: 0; background: transparent; }
        
        .slider-viewport {
            position: relative;
            width: 100%;
            max-width: 1920px;
            /* Use aspect-ratio to keep it 1920/660 regardless of width */
            aspect-ratio: 1920 / 660; 
            max-height: 660px;
            margin: 0 auto;
            overflow: hidden;
        }

        .slide-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out;
            z-index: 1;
        }

        .slide-item.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            /* 'contain' ensures the WHOLE image is always visible inside the box */
            /* 'cover' fills the box (might crop slightly) */
            object-fit: contain; 
            display: block;
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 1.5vw 1vw; /* Responsive padding based on viewport width */
            cursor: pointer;
            z-index: 10;
            font-size: 2vw; /* Arrow size scales with the slider */
            min-font-size: 18px;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .slider-viewport:hover .nav-btn {
            opacity: 1;
        }

        .prev { left: 0; border-radius: 0 5px 5px 0; }
        .next { right: 0; border-radius: 5px 0 0 5px; }
    </style>
</head>
<body>

<!--Current Slides-->

<div class="slider-viewport">
    
    <!--Trade Show-->
    <div class="slide-item active"><a href="https://shop.independentpetsupply.com/trade-show-2027">
    <img src="https://shop.independentpetsupply.com/documents/d/shop/gold-rush-cowboy-pet-banner"></a></div>

    <!--Yumwoof-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/documents/d/shop/yumwoof_iso_2026-1-" target="_blank">
    <img src="https://shop.independentpetsupply.com/documents/d/shop/yumwoof660_ribbon-burgandy"></a></div>

    <!--Raw Bistro-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/documents/d/shop/raw_bistro_iso_2026">
    <img src="https://shop.independentpetsupply.com/documents/d/shop/raw-bistro-660"></a></div>

    <!--California Cat Kitchen-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/documents/d/shop/california_cat_kitchen_iso_2026">
    <img alt="" class="slideImages imageSlide" src="https://shop.independentpetsupply.com/documents/d/shop/californiacatkitchen660" /></a></div>

    <!--Farmina-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/shop/-/o/category/668B75C4-FE4C-4B06-8DDF-2D3F4A2E1A54%7CB44612D0-4320-43E1-8B81-C739BF7234D4%7C16D97E0F-ED04-4E96-A4D1-96A655DEDB37/cn/Farmina">
    <img src="https://shop.independentpetsupply.com/documents/d/shop/farmina-660"></a></div>
        
    <!--Redbarn-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/shop/-/o/category/668B75C4-FE4C-4B06-8DDF-2D3F4A2E1A54%7C182895B6-2582-4EC4-9697-D8D898C98B71%7CB8723EF5-E6EC-4666-89EA-7C36AE1C38B5/cn/Redbarn">
    <img src="https://shop.independentpetsupply.com/documents/d/shop/redbarn-660"></a></div>

    <!--Lotus-->
    <div class="slide-item"><a href="https://shop.independentpetsupply.com/documents/d/shop/lotus_iso_2026">
    <img alt="" class="slideImages imageSlide" src="https://shop.independentpetsupply.com/documents/d/shop/lotus660" /></a></div>

    
    
    
    
    <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>
</div>

<script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.slide-item');

    function changeSlide(direction) {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + direction + slides.length) % slides.length;
        slides[currentIndex].classList.add('active');
    }

    let autoPlay = setInterval(() => changeSlide(1), 5000);

    function handleManualNav(direction) {
        clearInterval(autoPlay);
        changeSlide(direction);
        autoPlay = setInterval(() => changeSlide(1), 5000);
    }

    document.querySelector('.prev').onclick = () => handleManualNav(-1);
    document.querySelector('.next').onclick = () => handleManualNav(1);
</script>

</body>
</html>
